<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mahjong table</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <main class="app" id="app">
      <section class="board" id="board" aria-label="Mahjong table">
        <img
          class="reference-overlay"
          id="reference-overlay"
          src="/reference3.png"
          width="1512"
          height="982"
          alt=""
          hidden
        />
        <section class="playfield" id="playfield" aria-label="Play area"></section>

        <section class="seat seat-top" id="seat-top" aria-label="Top seat"></section>
        <section class="seat seat-left" id="seat-left" aria-label="Left seat"></section>
        <section class="seat seat-right" id="seat-right" aria-label="Right seat"></section>

        <section class="center" aria-label="Table centre">
          <div class="center-scores" id="center-scores" aria-label="Scores"></div>
          <p class="center-meta" id="center-meta"></p>
          <div class="wall-dial" id="wall-dial">
            <svg viewBox="0 0 72 72" aria-hidden="true">
              <circle class="wall-track" cx="36" cy="36" r="31"></circle>
              <circle class="wall-ring" id="wall-ring" cx="36" cy="36" r="31"></circle>
            </svg>
            <span class="wall-count" id="wall-count">0</span>
            <span class="wall-label">wall</span>
          </div>
        </section>

        <section class="river-zone zone-top" id="river-top" aria-label="Top seat discards"></section>
        <section class="river-zone zone-left" id="river-left" aria-label="Left seat discards"></section>
        <section class="river-zone zone-right" id="river-right" aria-label="Right seat discards"></section>
        <section class="river-zone zone-bottom" id="river-bottom" aria-label="Your discards"></section>

        <section class="hand-band" aria-label="Your hand">
          <div class="hand-badge" id="hand-badge"></div>
          <div class="hand-layout">
            <div class="self-info">
              <div class="self-label" id="self-label"></div>
              <div class="own-bonus" id="own-bonus" aria-label="Bonus tiles"></div>
            </div>
            <div class="own-melds" id="own-melds" aria-label="Your melds"></div>
            <div class="hand" id="hand" role="group" aria-label="Your hand"></div>
          </div>
        </section>

        <div class="action-cluster" id="actions" aria-label="Available actions"></div>
        <div class="claim-bar" id="claim-bar" hidden aria-label="Claim window"></div>
      </section>

      <aside class="rail" id="rail" aria-label="Table information">
        <header class="rail-head">
          <div>
            <h1>Mahjong</h1>
            <p class="meta" id="meta"></p>
            <div class="state-tag" id="state-tag" hidden>
              <span class="state-tag-name"></span>
              <span class="state-tag-title"></span>
            </div>
          </div>
          <button class="ghost-button" id="rail-hide" type="button">Hide rail</button>
        </header>

        <section class="rail-block" aria-labelledby="score-title">
          <h2 id="score-title">Scorecard</h2>
          <div class="scorecard" id="scorecard"></div>
        </section>

        <section class="rail-block" aria-labelledby="turn-title">
          <h2 id="turn-title">Turn</h2>
          <div class="turn-wrap">
            <ol class="turn-track" id="turn-track"></ol>
            <p class="turn-text" id="turn-text"></p>
          </div>
        </section>

        <section class="rail-block" id="waits-block" aria-labelledby="waits-title">
          <h2 id="waits-title">Waiting on</h2>
          <div class="waits" id="waits"></div>
        </section>

        <section class="rail-block" id="fishing-block" aria-labelledby="fishing-title" hidden>
          <h2 id="fishing-title">Fishing</h2>
          <div class="fishing" id="fishing"></div>
        </section>

        <details class="rail-block log-block">
          <summary>Table log</summary>
          <pre class="log" id="log" tabindex="0"></pre>
        </details>

        <footer class="rail-actions">
          <button class="ghost-button" id="new-game" type="button">
            New game
          </button>
          <button class="ghost-button" id="undo" type="button">Undo</button>
        </footer>
      </aside>

      <button class="rail-toggle" id="rail-show" type="button" hidden>Show rail</button>

      <section id="outcome" class="outcome" hidden aria-live="polite"></section>
    </main>

    <p class="sr-only" id="live-turn" role="status" aria-live="polite" aria-atomic="true"></p>

    <script type="module" src="/app.js"></script>
  </body>
</html>
