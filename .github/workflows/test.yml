name: test

on:
  push:
    branches: [main]
    # A tag v* is a release to testers (see the deploy-testers job).
    tags: ["v*"]
  pull_request:
  # The 300-hand soak takes minutes: it runs nightly, or on demand.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes a run still going for the same branch.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and build
    # Pinned, so the runner image never changes underneath the tests.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      # Only the type checker is installed; the tests and the game need
      # nothing, because Node runs the TypeScript directly.
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The app testers install is the static build. It is built once, here,
      # and the deploy jobs below publish exactly these files.
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
          if-no-files-found: error

  # Every push to main that passes the tests goes to the development site
  # (int-dev), so work done in any session can be looked at by pushing.
  # Testers are not on this site.
  deploy-dev:
    name: Deploy dev (int-dev)
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # One deploy at a time, and never cancelled halfway.
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/deploy
        with:
          token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy --env dev

  # The tester site (int) changes only when a tag v* is pushed, or when this
  # workflow is run by hand against a tag (to re-deploy or roll back). The
  # build takes its version from the tag (scripts/build.ts).
  deploy-testers:
    name: Deploy testers (int)
    needs: test
    if: >-
      github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: deploy-testers
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/deploy
        with:
          token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy

  # Each pull request from this repository gets its own link on int-dev
  # (https://pr-<number>-int-dev.<account>.workers.dev), in one comment that
  # is updated on every push. It never touches the tester site. Not a
  # required check: a failing preview must not block a merge.
  preview:
    name: Preview (PR link)
    needs: test
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/deploy
        with:
          token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: versions upload --env dev --preview-alias pr-${{ github.event.pull_request.number }} --message PR-${{ github.event.pull_request.number }}-${{ github.sha }}
      - name: Post or update the preview comment
        run: |
          url=$(grep -oE 'https://pr-[A-Za-z0-9.-]+\.workers\.dev' wrangler.log 2>/dev/null | head -1 || true)
          if [ -z "$url" ]; then echo "::notice::No preview link to post."; exit 0; fi
          marker='<!-- int-maj-preview -->'
          body="$marker"$'\n'"**Preview:** $url"$'\n\n'"Commit \`${GITHUB_SHA::7}\`. Updated on every push; the tester site is not affected."
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq "[.[] | select(.body | startswith(\"$marker\"))][0].id // empty")
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body"
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body"
          fi

  soak:
    name: Soak (300 hands)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref_type != 'tag')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: npm run soak
