name: test

on:
  push:
    branches: [main]
  pull_request:
  # The 300-hand soak takes minutes: it runs nightly, or on demand.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

# A newer push supersedes a run still going for the same branch.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and build
    # Pinned, so the runner image never changes underneath the tests.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # No dependencies to install: Node runs the TypeScript directly.
      - run: npm test
      # The app testers install is the static build: prove it still builds.
      - run: npm run build

  soak:
    name: Soak (300 hands)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm run soak
