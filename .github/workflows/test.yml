name: test

on:
  push:
    branches: [main]
  pull_request:
  # The 300-hand soak takes minutes: it runs nightly, or on demand.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

# A newer push supersedes a run still going for the same branch.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and build
    # Pinned, so the runner image never changes underneath the tests.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # No dependencies to install: Node runs the TypeScript directly.
      - run: npm test
      # The app testers install is the static build: prove it still builds.
      - run: npm run build

  # Every push to main that passes the tests is published, so work done
  # anywhere - a laptop or a cloud session from a phone - goes live by pushing.
  deploy:
    name: Deploy to Cloudflare
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # One deploy at a time, and never cancelled halfway.
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Skip until the Cloudflare token is set
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::No CLOUDFLARE_API_TOKEN secret yet, so nothing was deployed."
      - uses: actions/checkout@v5
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v5
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 24
      - run: npm run build
        if: env.CLOUDFLARE_API_TOKEN != ''
      - run: npx --yes wrangler@4.158.0 deploy
        if: env.CLOUDFLARE_API_TOKEN != ''

  soak:
    name: Soak (300 hands)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm run soak
