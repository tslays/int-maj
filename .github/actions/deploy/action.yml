# One Cloudflare deploy step, shared by the dev, tester and preview jobs:
# fetch the `dist` the test job built and hand it to wrangler. Without a
# token it does nothing and says so, so a fork or a fresh repository stays
# green. The job must have checked the repository out (for wrangler.jsonc).
name: Deploy dist with wrangler
description: Download the built dist/ and run one wrangler command on it.
inputs:
  token:
    description: The Cloudflare API token (pass the repository secret).
    required: true
  command:
    description: The wrangler arguments, for example "deploy --env dev".
    required: true
  report-token:
    description: >-
      The GitHub token the Worker files problem reports with (pass the
      repository secret REPORT_GITHUB_TOKEN). Empty leaves the Worker's
      secret as it is.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Skip until the Cloudflare token is set
      if: inputs.token == ''
      shell: bash
      run: echo "::notice::No CLOUDFLARE_API_TOKEN secret yet, so nothing was deployed."
    - uses: actions/download-artifact@v4
      if: inputs.token != ''
      with:
        name: dist
        path: dist
    - uses: actions/setup-node@v5
      if: inputs.token != ''
      with:
        node-version-file: .nvmrc
    # The output is kept in wrangler.log for a job that needs to read it.
    - name: wrangler ${{ inputs.command }}
      if: inputs.token != ''
      shell: bash
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.token }}
        WRANGLER_ARGS: ${{ inputs.command }}
        REPORT_GITHUB_TOKEN: ${{ inputs.report-token }}
      run: |
        set -o pipefail
        secrets=()
        if [ -n "$REPORT_GITHUB_TOKEN" ]; then
          # Written outside the checkout and removed again; never printed.
          file="$RUNNER_TEMP/worker-secrets.json"
          node -e 'require("fs").writeFileSync(process.argv[1], JSON.stringify({ REPORT_GITHUB_TOKEN: process.env.REPORT_GITHUB_TOKEN }))' "$file"
          secrets=(--secrets-file "$file")
          trap 'rm -f "$file"' EXIT
        else
          echo "::notice::No REPORT_GITHUB_TOKEN secret, so the Worker's report token is left as it is."
        fi
        npx --yes wrangler@4.158.0 $WRANGLER_ARGS "${secrets[@]}" | tee wrangler.log
