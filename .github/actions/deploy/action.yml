# One Cloudflare deploy step, shared by the dev, tester and preview jobs:
# fetch the build the test job made (`dist`, or the landing page's
# `dist-site`) and hand it to wrangler. Without a
# token it does nothing and says so, so a fork or a fresh repository stays
# green. The job must have checked the repository out (for wrangler.jsonc).
name: Deploy dist with wrangler
description: Download the built dist/ and run one wrangler command on it.
inputs:
  token:
    description: The Cloudflare API token (pass the repository secret).
    required: true
  command:
    description: The wrangler arguments, for example "deploy --env dev".
    required: true
  artifact:
    description: >-
      The build artifact to deploy and the folder it lands in: "dist" (the
      game) or "dist-site" (the landing page).
    required: false
    default: dist
  rooms:
    description: >-
      The wrangler arguments that deploy the rooms Worker first (for example
      "deploy -c wrangler.rooms.jsonc --env dev"). Empty skips it, as a
      preview does: previews use the dev rooms Worker as main deployed it.
    required: false
    default: ""
  report-token:
    description: >-
      The GitHub token the Worker files problem reports with (pass the
      repository secret REPORT_GITHUB_TOKEN). Empty leaves the Worker's
      secret as it is.
    required: false
    default: ""
  photo-token:
    description: >-
      The bearer token that opens GET /api/report-photo/<key> (pass the
      repository secret REPORT_PHOTO_TOKEN). Empty leaves the Worker's
      secret as it is.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Skip until the Cloudflare token is set
      if: inputs.token == ''
      shell: bash
      run: echo "::notice::No CLOUDFLARE_API_TOKEN secret yet, so nothing was deployed."
    - uses: actions/download-artifact@v8
      if: inputs.token != ''
      with:
        name: ${{ inputs.artifact }}
        path: ${{ inputs.artifact }}
    - uses: actions/setup-node@v7
      if: inputs.token != ''
      with:
        node-version-file: .nvmrc
    # The app Worker binds to the rooms Worker's Durable Object, so it goes first.
    - name: wrangler ${{ inputs.rooms }}
      if: inputs.token != '' && inputs.rooms != ''
      shell: bash
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.token }}
        WRANGLER_ARGS: ${{ inputs.rooms }}
      run: npx --yes wrangler@4.158.0 $WRANGLER_ARGS
    # The output is kept in wrangler.log for a job that needs to read it.
    - name: wrangler ${{ inputs.command }}
      if: inputs.token != ''
      shell: bash
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.token }}
        WRANGLER_ARGS: ${{ inputs.command }}
        REPORT_GITHUB_TOKEN: ${{ inputs.report-token }}
        REPORT_PHOTO_TOKEN: ${{ inputs.photo-token }}
      run: |
        set -o pipefail
        secrets=()
        # Written outside the checkout and removed again; never printed. Only
        # the secrets that are set are sent; the others stay as the Worker has them.
        file="$RUNNER_TEMP/worker-secrets.json"
        node -e 'const o = {}; for (const n of ["REPORT_GITHUB_TOKEN", "REPORT_PHOTO_TOKEN"]) if (process.env[n]) o[n] = process.env[n]; if (Object.keys(o).length) require("fs").writeFileSync(process.argv[1], JSON.stringify(o))' "$file"
        if [ -f "$file" ]; then
          secrets=(--secrets-file "$file")
          trap 'rm -f "$file"' EXIT
        else
          echo "::notice::No REPORT_GITHUB_TOKEN or REPORT_PHOTO_TOKEN secret, so the Worker's secrets are left as they are."
        fi
        npx --yes wrangler@4.158.0 $WRANGLER_ARGS "${secrets[@]}" | tee wrangler.log
